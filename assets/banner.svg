<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-labelledby="t d">
<title id="t">decision-card</title>
<desc id="d">Three panels from the repo's README and its example run. 1, the decision as asked: reflect on: should I rewrite the webhook handler or keep patching it? 2, the stress test: GATE, Reversible. LOOK, 3 open issues, all in that one function. RESHAPE, C: rewrite only normalizeEvent(). ATTACK, ~5x cheaper for the same bug surface. 3, the card, answer first: THE CALL: Rewrite only normalizeEvent() behind the existing flag; don't touch the rest of the handler. HOW SURE: ~80%, then DO THIS NEXT, THE CASE AGAINST and THIS FLIPS IF.</desc>
<style>
.serif{font-family:Georgia,"Times New Roman",serif}
.sans{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.lab{font-size:10px;letter-spacing:1.8px;font-weight:600}
.cap{font-size:11.5px;fill:#8b9096}
.hl{fill:none;stroke-width:1.5;opacity:0}
.h1{animation:h1 12s infinite}
.h2{animation:h2 12s infinite}
.h3{animation:h3 12s infinite}
.r1{animation:r1 12s infinite}
.rb{animation:rb 12s infinite}
.rc{animation:rc 12s infinite}
.rd{animation:rd 12s infinite}
.re{animation:re 12s infinite}
.rf{animation:rf 12s infinite}
.rg{animation:rg 12s infinite}
.rh{animation:rh 12s infinite}
@keyframes h1{0%,16.7%{opacity:0}18.7%,42.4%{opacity:1}44.1%,100%{opacity:0}}
@keyframes h2{0%,16.7%,18.7%,44.1%{opacity:0}45.8%,67.8%{opacity:1}69.5%,100%{opacity:0}}
@keyframes h3{0%,16.7%,18.7%,69.5%{opacity:0}71.2%,94.9%{opacity:1}96.6%,100%{opacity:0}}
@keyframes r1{0%,16.7%{opacity:1}18.7%,21.2%{opacity:0}22.9%,100%{opacity:1}}
@keyframes rb{0%,16.7%{opacity:1}18.7%,45%{opacity:0}46.6%,100%{opacity:1}}
@keyframes rc{0%,16.7%{opacity:1}18.7%,50%{opacity:0}51.7%,100%{opacity:1}}
@keyframes rd{0%,16.7%{opacity:1}18.7%,55.1%{opacity:0}56.8%,100%{opacity:1}}
@keyframes re{0%,16.7%{opacity:1}18.7%,60.2%{opacity:0}61.9%,100%{opacity:1}}
@keyframes rf{0%,16.7%{opacity:1}18.7%,72.1%{opacity:0}73.7%,100%{opacity:1}}
@keyframes rg{0%,16.7%{opacity:1}18.7%,79.7%{opacity:0}81.4%,100%{opacity:1}}
@keyframes rh{0%,16.7%{opacity:1}18.7%,85.6%{opacity:0}87.3%,100%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="900" height="300" fill="#141618"/>

<text x="32" y="50" class="serif" font-size="28" fill="#e4dfd4">decision-card</text>
<text x="216" y="50" class="sans" font-size="13.5" fill="#a9adb2">A static Claude skill that stress-tests a decision and returns an answer-first card.</text>

<g>
<text x="32" y="88" class="sans lab" fill="#a39bbd">1 · REWRITE OR PATCH?</text>
<rect x="32" y="98" width="240" height="152" rx="3" fill="#1b1e21" stroke="#2e3237"/>
<rect class="hl h1" x="32" y="98" width="240" height="152" rx="3" stroke="#a39bbd"/>
<text x="44" y="115" class="mono" font-size="10" fill="#8b9096">README.md · usage</text>
<line x1="33" y1="123" x2="271" y2="123" stroke="#2e3237"/>
<g class="r1"><rect x="56" y="148" width="194" height="58" rx="12" fill="#2a2e33"/><text x="70" y="168" class="sans" font-size="10.5" fill="#e4dfd4">reflect on: should I rewrite</text><text x="70" y="182" class="sans" font-size="10.5" fill="#e4dfd4">the webhook handler or keep</text><text x="70" y="196" class="sans" font-size="10.5" fill="#e4dfd4">patching it?</text></g>
<text x="32" y="272" class="sans cap">Two options and no clear way to choose.</text>
</g>

<g>
<text x="292" y="88" class="sans lab" fill="#c8963e">2 · STRESS-TEST</text>
<rect x="292" y="98" width="296" height="152" rx="3" fill="#17191c" stroke="#2e3237"/>
<rect class="hl h2" x="292" y="98" width="296" height="152" rx="3" stroke="#c8963e"/>
<text x="304" y="115" class="mono" font-size="10" fill="#8b9096">examples/example-run.md · example</text>
<line x1="293" y1="123" x2="587" y2="123" stroke="#2e3237"/>
<g class="rb"><text x="304" y="147" class="mono" font-size="10" fill="#c8963e" font-weight="700">GATE</text><text x="364" y="147" class="sans" font-size="10.5" fill="#e4dfd4">Reversible.</text></g>
<g class="rc"><text x="304" y="173" class="mono" font-size="10" fill="#c8963e" font-weight="700">LOOK</text><text x="364" y="173" class="sans" font-size="10.5" fill="#e4dfd4">3 open issues, all in that one function.</text></g>
<g class="rd"><text x="304" y="199" class="mono" font-size="10" fill="#c8963e" font-weight="700">RESHAPE</text><text x="364" y="199" class="sans" font-size="10.5" fill="#e4dfd4">C: rewrite only <tspan class="mono" font-size="10">normalizeEvent()</tspan></text></g>
<g class="re"><text x="304" y="225" class="mono" font-size="10" fill="#c8963e" font-weight="700">ATTACK</text><text x="364" y="225" class="sans" font-size="10.5" fill="#e4dfd4">~5x cheaper for the same bug surface.</text></g>
<text x="292" y="272" class="sans cap">Undo cost, real numbers, a cheaper option C.</text>
</g>

<g>
<text x="608" y="88" class="sans lab" fill="#93ad8c">3 · THE CARD</text>
<rect x="608" y="98" width="260" height="152" rx="3" fill="#1b1e21" stroke="#2e3237"/>
<rect class="hl h3" x="608" y="98" width="260" height="152" rx="3" stroke="#93ad8c"/>
<text x="620" y="115" class="mono" font-size="10" fill="#8b9096">examples/example-run.md · example</text>
<line x1="609" y1="123" x2="867" y2="123" stroke="#2e3237"/>
<g class="rf"><text x="620" y="142" class="mono" font-size="10" fill="#93ad8c" font-weight="700">THE CALL:</text><text x="620" y="157" class="sans" font-size="10.5" fill="#e4dfd4">Rewrite only <tspan class="mono" font-size="10">normalizeEvent()</tspan></text><text x="620" y="171" class="sans" font-size="10.5" fill="#e4dfd4">behind the existing flag; don't touch</text><text x="620" y="185" class="sans" font-size="10.5" fill="#e4dfd4">the rest of the handler.</text></g>
<g class="rg"><text x="620" y="204" class="mono" font-size="10" fill="#93ad8c" font-weight="700">HOW SURE:</text><text x="684" y="204" class="mono" font-size="10" fill="#e4dfd4">~80%</text><rect x="722" y="197" width="120" height="7" rx="1.5" fill="none" stroke="#3d4248"/><rect x="722" y="197" width="96" height="7" rx="1.5" fill="#93ad8c"/></g>
<g class="rh"><text x="620" y="220" class="mono" font-size="10" fill="#8b9096">DO THIS NEXT</text><rect x="726" y="214" width="110" height="3" fill="#3d4248"/><text x="620" y="232" class="mono" font-size="10" fill="#8b9096">THE CASE AGAINST</text><rect x="726" y="226" width="92" height="3" fill="#3d4248"/><text x="620" y="244" class="mono" font-size="10" fill="#8b9096">THIS FLIPS IF</text><rect x="726" y="238" width="104" height="3" fill="#3d4248"/></g>
<text x="608" y="272" class="sans" font-size="11.5" fill="#93ad8c">The answer first, then the case against.</text>
</g>
</svg>
